# `cargo deny` 配置：后端依赖安全审计基线（见 AGENTS.md §8.5）。
# 只启用误报率低的检查：RUSTSEC 公告 + crate 来源 + bans（多版本仅警告，不红灯）。
# 许可证收紧待依赖清单稳定后再做，避免模板初始化即红灯。
[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# 以下忽略均为 tauri 生态传递依赖，公告本身注明无安全升级可用（unmaintained 非可利用漏洞），
# 本仓无法直接升级，只能等上游（tauri / tauri-specta / gtk 系）迁移；每次升级 tauri 系依赖时重访本表。
ignore = [
  # paste：经 specta → tauri-specta 引入，过程宏仅构建期使用，不进运行时
  { id = "RUSTSEC-2024-0436", reason = "transitive via specta/tauri-specta, build-time proc-macro only, no safe upgrade per advisory" },
  # proc-macro-error：经 glib/gtk（仅 Linux 托盘链 tray-icon → tauri）引入，构建期使用
  { id = "RUSTSEC-2024-0370", reason = "transitive via gtk stack on linux tray backend, build-time only, no safe upgrade per advisory" },
  # ttf-parser：经 fontdb → tauri-plugin-system-fonts（系统字体枚举）引入
  { id = "RUSTSEC-2026-0192", reason = "transitive via fontdb/tauri-plugin-system-fonts, no safe upgrade per advisory" },
  # unic-*：经 urlpattern → tauri-utils（tauri 核心）引入，共 4 条同源公告
  { id = "RUSTSEC-2025-0081", reason = "transitive via urlpattern/tauri-utils, no safe upgrade per advisory" },
  { id = "RUSTSEC-2025-0075", reason = "transitive via urlpattern/tauri-utils, no safe upgrade per advisory" },
  { id = "RUSTSEC-2025-0080", reason = "transitive via urlpattern/tauri-utils, no safe upgrade per advisory" },
  { id = "RUSTSEC-2025-0098", reason = "transitive via urlpattern/tauri-utils, no safe upgrade per advisory" },
  { id = "RUSTSEC-2025-0100", reason = "transitive via urlpattern/tauri-utils, no safe upgrade per advisory" },
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
