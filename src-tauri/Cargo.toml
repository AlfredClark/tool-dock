[package]
name = "tool-dock"
version = "0.1.0"
edition = "2024"
authors = ["Alfred Clark"]
description = "A cross-platform desktop toolbox."
repository = "https://github.com/AlfredClark/tool-dock"
keywords = ["tauri", "desktop", "toolbox"]
categories = ["gui"]
readme = "../README.md"
license = "GPL-3.0-only"

[lib]
name = "tool_dock_lib"
crate-type = ["rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-log = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0"
toml = "0.8"
quick-xml = "0.38"
rust-ini = "0.21"
java-properties = "2"
encoding_rs = "0.8"
rust-i18n = "4.2.1"
chrono = "0.4.45"
log = "0.4.34"
thiserror = "2"
specta = "=2.0.0-rc.25"
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["javascript", "typescript"] }
anyhow = "1.0.104"
# 与 `@tauri-apps/plugin-sql` 同 minor（`check-version-sync` 会校验）
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-system-fonts = "2.0.2"
tauri-plugin-clipboard-manager = "2"
# 与 `@tauri-apps/plugin-http` 同 minor（`check-version-sync` 会校验）
tauri-plugin-http = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"
