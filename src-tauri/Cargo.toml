[package]
name = "tool-dock"
version = "0.1.0"
edition = "2024"
authors = ["Alfred Clark"]
description = "A cross-platform desktop toolbox."
repository = "https://github.com/AlfredClark/tool-dock"
keywords = ["tauri", "desktop", "toolbox"]
categories = ["gui"]
readme = "../README.md"
license = "GPL-3.0-only"

[lib]
name = "tool_dock_lib"
crate-type = ["rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-log = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yml 已废弃且有 unsound 公告（RUSTSEC-2025-0068），改用其官方迁移目标 noyalib（纯 Rust 实现）
noyalib = { version = "0.0", features = ["compat-serde-yaml"] }
toml = "0.8"
# RUSTSEC-2026-0194/0195 在 >= 0.41.0 修复，取最小修复版本
quick-xml = "0.41"
rust-ini = "0.21"
java-properties = "2"
# 图片预览缩略图转 `data:` URL（`asset` 协议需配 scope 才放行本地路径，
# 直接回 data URL 可保持最小授权；CSP 的 `img-src` 已放行 `data:`）
base64 = "0.22"
encoding_rs = "0.8"
# 图片尺寸工具：解码/缩放/编码（只要 jpeg/png/gif/webp/bmp/tiff 六格式，
# 关掉 avif 等重型编解码以收敛依赖面；缩放用 Lanczos3，单线程即可）
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "tiff",
    "webp",
] }
rust-i18n = "4.2.1"
chrono = "0.4.45"
log = "0.4.34"
thiserror = "2"
specta = "=2.0.0-rc.25"
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["javascript", "typescript"] }
anyhow = "1.0.104"
# 与 `@tauri-apps/plugin-sql` 同 minor（`check-version-sync` 会校验）
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-system-fonts = "2.0.2"
tauri-plugin-clipboard-manager = "2"
# 与 `@tauri-apps/plugin-dialog` 同 minor（`check-version-sync` 会校验）
tauri-plugin-dialog = "2"
# 与 `@tauri-apps/plugin-http` 同 minor（`check-version-sync` 会校验）
tauri-plugin-http = "2"
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
xz2 = "0.1"
sha2 = "0.10"
hex = "0.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"
